name: Static preview branch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/static-preview.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: static-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Push orphan static-preview branch
        env:
          # Commits as Vishesh only — no bot Co-authored-by trailers
          GIT_AUTHOR_NAME: Vishesh
          GIT_AUTHOR_EMAIL: 87526302+vishesh9131@users.noreply.github.com
          GIT_COMMITTER_NAME: Vishesh
          GIT_COMMITTER_EMAIL: 87526302+vishesh9131@users.noreply.github.com
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          WORK="$(mktemp -d)"
          cp -a "$ROOT/_site/." "$WORK/"
          cd "$WORK"
          git init
          git checkout --orphan static-preview
          git add -A
          git -c trailer.ifexists=doNothing commit --no-verify -m "Publish static Academic Pages preview"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin static-preview
          echo "STATIC_PREVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Published static-preview at $(git rev-parse HEAD)"

      - name: Enable or update GitHub Pages (branch static-preview / root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer legacy branch deploy so the orphan branch root is the site.
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f source[branch]=static-preview \
              -f source[path]=/
            echo "Updated existing Pages config"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f source[branch]=static-preview \
              -f source[path]=/
            echo "Created Pages config"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{url:.html_url,status:.status,source:.source}'
