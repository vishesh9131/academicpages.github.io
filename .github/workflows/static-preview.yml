name: Static preview branch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/static-preview.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: static-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      # Orphan static-preview with _site at branch root; author Vishesh only
      - name: Push orphan static-preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: static-preview
          force_orphan: true
          user_name: Vishesh
          user_email: 87526302+vishesh9131@users.noreply.github.com
          commit_message: Publish static Academic Pages preview

      - name: Enable or update GitHub Pages (branch static-preview / root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f source[branch]=static-preview \
              -f source[path]=/
            echo "Updated existing Pages config"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f source[branch]=static-preview \
              -f source[path]=/
            echo "Created Pages config"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{url:.html_url,status:.status,source:.source}'
